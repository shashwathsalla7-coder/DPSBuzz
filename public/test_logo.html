<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; display: flex; gap: 40px; padding: 40px; background: #333; }
  .box { padding: 30px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .light { background: #FFFFFF; }
  .dark { background: #000000; }
</style>
</head>
<body>
  <div class="box light">
    <h3 style="color:#000">Light Mode (Black DPS)</h3>
    <img src="/icons/wordmark.png" height="50" />
    <img src="/icons/wordmark.png" height="90" />
  </div>
  <div class="box dark">
    <h3 style="color:#fff">Dark Mode (White DPS)</h3>
    <img src="/icons/wordmark_dark.png" height="50" />
    <img src="/icons/wordmark_dark.png" height="90" />
  </div>
</body>
</html>
